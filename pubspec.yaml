name: filalab
description: Teoría de colas M/M/1 y M/M/s para las cajas de un supermercado (Reto 3).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  pdf: ^3.11.1
  printing: ^5.13.4
  file_picker: ^8.1.2
  excel: ^4.0.6
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fuentes/
    - assets/sonidos/
